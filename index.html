<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Lucemus</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root { --grund: #F6F3EC; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --grund: #0F1A2A; } }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--grund);
      display: grid;
      place-items: center;
      padding: 16px;
      box-sizing: border-box;
    }
    img { width: min(420px, 80vw); height: auto; display: block; }
  </style>
</head>
<body>
  <picture>
    <source srcset="logo-negativ.svg" media="(prefers-color-scheme: dark)">
    <img src="logo.svg" alt="Lucemus">
  </picture>
</body>
</html>
